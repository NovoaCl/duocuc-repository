services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-db

    ports:
      - "1521:1521"
      - "5500:5500"

    environment:
      ORACLE_PWD: "Oracle12345"
      ORACLE_CHARACTERSET: "AL32UTF8"

    volumes:
      - oracle-data:/opt/oracle/oradata

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  oracle-data: